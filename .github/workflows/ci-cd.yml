name: Java CI/CD & AI Code Review

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - master
      - develop

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build-test-format:
    name: Build, Format and Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Apply Code Formatting with Spotless
        run: mvn spotless:apply

      - name: Commit Formatting Changes (if any)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format code with Spotless [skip ci]"
          file_pattern: 'src/**/*.java'

      - name: Run Unit Tests
        run: mvn test

  ai-code-review:
    name: AI Source Code Review
    needs: build-test-format
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'closed'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Git Diff
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt

      - name: Run AI Review Script
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const runReview = require('./.github/scripts/ai-review.js');
            await runReview({ github, context });

  delete-branch:
    name: Delete Source Branch after Merge
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true

    steps:
      - name: Delete branch
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;
            const repo = context.repo;

            // Bỏ qua nếu là các nhánh chính hoặc nhánh được bảo vệ
            const protectedBranches = ['main', 'master', 'develop', 'release'];
            if (protectedBranches.includes(branchName)) {
              console.log(`Nhánh '${branchName}' nằm trong danh sách được bảo vệ, bỏ qua.`);
              return;
            }

            try {
              console.log(`Đang tiến hành xóa nhánh nguồn '${branchName}' sau khi merge thành công...`);
              await github.rest.git.deleteRef({
                owner: repo.owner,
                repo: repo.repo,
                ref: `heads/${branchName}`
              });
              console.log(`✅ Đã xóa nhánh nguồn '${branchName}' thành công.`);
            } catch (error) {
              console.error(`❌ Không thể tự động xóa nhánh '${branchName}':`, error);
            }

