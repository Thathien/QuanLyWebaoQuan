name: Java CI/CD & AI Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - master
      - develop

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:

  build-test-format:
    name: Build, Format and Test
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'pull_request'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Apply Spotless Format
        run: mvn -B spotless:apply

      - name: Commit Format Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format code [skip ci]"
          file_pattern: "src/**/*.java"

      - name: Run Unit Test
        run: mvn -B test

  ai-code-review:
    name: AI Source Code Review
    runs-on: ubuntu-latest

    needs: build-test-format

    if: |
      github.event_name == 'pull_request' &&
      github.event.action != 'closed'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Diff
        run: |
          git fetch origin ${{ github.base_ref }}

          mkdir -p review-files

          git diff \
            --unified=20 \
            origin/${{ github.base_ref }}...HEAD \
            > diff.txt

      - name: Run Gemini AI Review
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const runReview = require('./.github/scripts/ai-review.js');
            await runReview({ github, context });
